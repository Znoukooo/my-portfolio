    <style>
        .tag{
            background-color: rgba(30, 144, 255, 0.1); /* Biru sangat transparan */
        color: #3498db; /* Teks biru solid */
        padding: 6px 20px;
        border-radius: 50px;
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 500;
        transition: 0.3s;
    
        }
        .card{
            border: none !important;
            background-color: var(--apa);
            color: var(--text-color);
        }
        .card-text{
            font-weight: 700;
            color: var(--primary-color);
        }

        .text-gradient{
            /* Mengambil warna dari variabel :root Anda */
        background: linear-gradient(90deg, var(--accent-color), var(--secondary-color));
        
        /* Trik Clipping Text */
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: transparent; /* Fallback jika browser tidak support webkit */
        
        font-weight: 800;
        display: inline-block;
    
        }

        [data-theme="dark"] body{
            background-color: var(--background-dark);
        } 
        [data-theme="dark"] .card{
            background-color: var(--ape);
            color: var(--text-dark) !important;
        }
        [data-theme="dark"] .card-text{
            
            color: var(--text-dark) !important;
        }
        [data-theme="dark"] .port{
            color: var(--text-dark);
        }

        .footer {
    background-color: var(--apa);
    border-radius: 10px; /* Membuat sudut card melengkung halus */
}

.logo-footer {
    color: var(--text-color) !important; /* Supaya icon jadi putih di atas background biru */
    margin: 0 10px;
    text-decoration: none;
    font-size: 22px;
    transition: 0.3s;
}

.logo-footer:hover {
    opacity: 0.7;
    transform: translateY(-3px); /* Efek melayang sedikit saat hover */
}
[data-theme="dark"] .footer{
    background-color: var(--ape) !important;
    color: var(--text-dark) !important;
}
[data-theme="dark"] .copyright{
    color: var(--text-dark) !important;
}
[data-theme="dark"] .logo-footer{
    color: var(--text-dark) !important;
    opacity: 0.6;
}

.contact{
    background-color: var(--apa) !important;
    border-radius: 10px;
    
}
[data-theme="dark"] .contact{
    background-color: var(--ape) !important;
    border-radius: 10px;
    
}

.contact-info{
    color: var(--text-color) !important;
    font-weight: 700;
}
.paragraf-info{
    color: var(--text-color) !important;
    opacity: 0.6;
}
[data-theme="dark"] .contact-info{
    color: var(--text-dark) !important;
    font-weight: 700;
}
[data-theme="dark"] .paragraf-info{
    color: var(--text-dark) !important;
    opacity: 0.6;
}

.icon-box {
    background-color: rgba(85, 73, 195, 0.1); /* Warna primary-color versi transparan */
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50px;
    flex-shrink: 0; /* Mencegah ikon mengecil jika teks panjang */
    text-decoration: none !important;
    color: var(--primary-color);
    font-size: 25px;
}

[data-theme="dark"] .icon-box {
    background-color: rgba(255, 255, 255, 0.1);
}

/* Pastikan teks judul di Dark Mode tetap terlihat */
[data-theme="dark"] .card h5 {
    color: var(--text-dark) !important;
}

.ap{
    color: var(--text-color);
    opacity: 0.7;
}
[data-theme="dark"] .ap{
    color: var(--text-dark);
    opacity: 0.7;
}

/* Style Input Form */
.custom-input {
    background-color: var(--background-color) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    color: var(--text-color) !important;
    padding: 12px 15px;
    border-radius: 8px;
    transition: 0.3s;
    resize: none;
}

.custom-input:focus {
    background-color: rgba(255, 255, 255, 0.08) !important;
    border-color: var(--primary-color) !important;
    box-shadow: none !important;
}

/* Style Button */
.btn-send {
    background: linear-gradient(90deg, var(--accent-color), var(--secondary-color));
    color: var(--background-color);
    
    font-weight: 600;
    border-radius: 5px;
    transition: 0.3s;
    -webkit-background-clip: background;
-webkit-background-fill-color: transparent;
background-clip: background;
}
[data-theme="dark"] .btn-send {
    background: linear-gradient(90deg, var(--accent-color), var(--secondary-color));
    color: var(--background-color);
    font-weight: 600;
    border-radius: 5px;
    transition: 0.3s;
}

.btn-send:hover {
    background-color: var(--secondary-color);
    color: white;
    transform: translateY(-3px);
    box-shadow: 0 5px 15px rgba(85, 73, 195, 0.3);
}
[data-theme="dark"] .btn-send:hover {
    background-color: var(--secondary-dark);
    color: white;
    transform: translateY(-3px);
    box-shadow: 0 5px 15px rgba(85, 73, 195, 0.3);
}

/* Penyesuaian Dark Mode */
[data-theme="dark"] .custom-input {
    background-color: rgba(255, 255, 255, 0.05) !important;
    color: var(--background-color) !important;
}
[data-theme="dark"] .custom-input::placeholder {
   opacity: 0.5;
    color: var(--background-color) !important;
}

/* Perbaikan Text Break untuk Email Panjang */
.text-break {
    word-break: break-all;
}
