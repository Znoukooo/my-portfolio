    <style>
        .tag{
            background-color: rgba(30, 144, 255, 0.1); /* Biru sangat transparan */
        color: #3498db; /* Teks biru solid */
        padding: 6px 20px;
        border-radius: 50px;
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 500;
        transition: 0.3s;
    
        }
        .card{
            border: none !important;
            background-color: var(--apa);
            color: var(--text-color);
        }
        .card-text{
            font-weight: 700;
            color: var(--primary-color);
        }

        .text-gradient{
            /* Mengambil warna dari variabel :root Anda */
        background: linear-gradient(90deg, var(--accent-color), var(--secondary-color));
        
        /* Trik Clipping Text */
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: transparent; /* Fallback jika browser tidak support webkit */
        
        font-weight: 800;
        display: inline-block;
    
        }

        [data-theme="dark"] body{
            background-color: var(--background-dark);
        } 
        [data-theme="dark"] .card{
            background-color: var(--ape);
            color: var(--text-dark) !important;
        }
        [data-theme="dark"] .card-text{
            
            color: var(--text-dark) !important;
        }
        [data-theme="dark"] .port{
            color: var(--text-dark);
        }

        .footer {
    background-color: var(--apa);
    border-radius: 10px; /* Membuat sudut card melengkung halus */
}

.logo-footer {
    color: var(--text-color) !important; /* Supaya icon jadi putih di atas background biru */
    margin: 0 10px;
    text-decoration: none;
    font-size: 22px;
    transition: 0.3s;
}

.logo-footer:hover {
    opacity: 0.7;
    transform: translateY(-3px); /* Efek melayang sedikit saat hover */
}
[data-theme="dark"] .footer{
    background-color: var(--ape) !important;
    color: var(--text-dark) !important;
}
[data-theme="dark"] .copyright{
    color: var(--text-dark) !important;
}
[data-theme="dark"] .logo-footer{
    color: var(--text-dark) !important;
    opacity: 0.6;
}

.contact{
    background-color: var(--apa) !important;
    border-radius: 10px;
    
}
[data-theme="dark"] .contact{
    background-color: var(--ape) !important;
    border-radius: 10px;
    
}

.contact-info{
    color: var(--text-color) !important;
}
.paragraf-info{
    color: var(--text-color) !important;
    opacity: 0.8;
}
    </style>
</head>

    <div id="navbar-placeholder"></div>

            </div>
           
        </div>
        <div class="row">
            <div class="contact col-12 col-md-6 col-lg-5 justify-content-center my-4 p-5 shadow-sm">

                <div class="card">
                    <h1>hallo</h1>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-7 d-flex justify-content-center my-4 bg-danger">
                
            </div>
        </div>
    </div>

                    </a>
                    <a href="https://www.linkedin.com/in/khaisan-ramzi-278681313?utm_source=share&utm_campaign=share_via&utm_content=profile&utm_medium=android_app" target="_blank" class="logo-footer">
                        <ion-icon name="logo-linkedin"></ion-icon>
