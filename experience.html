 /* Profil & Typing */
 .profile-img { 
    border-radius: 10px; /* Diubah dari 10px menjadi 0px agar kotak sempurna */
    width: 100%; 
    max-width: 400px; 
    height: 400px; /* Tambahkan height yang sama dengan max-width agar rasio 1:1 */
    object-fit: cover; /* Tambahkan ini agar gambar tidak gepeng saat dipaksa kotak */
}
        .ies { 
            font-weight: 800; 
        }
        .grayscale-hover { 
            filter: grayscale(100%); 
            transition: filter 0.5s ease-in-out; 
            cursor: pointer; 
        }
        .grayscale-hover:hover { 
            filter: grayscale(0%); 
        }
        .cursor { 
            display: inline-block; 
            background-color: var(--primary-color); 
            width: 2px; margin-left: 4px; 
            animation: blink 1s infinite; 
            height: 1.2em; 
            vertical-align: bottom; }

        @keyframes blink { 
            0%, 50%, 100% { 
                opacity: 1; 
            } 25%, 75% { 
                opacity: 0; 
            } 
        }

        /* animate */
        /* 1. Definisikan gerakan animasi */
        @keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeInLeft {
    from {
        opacity: 0;
        transform: translateX(-30px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

/* Pastikan elemen tersembunyi sepenuhnya sebelum ada class .show */
.animate-up, .animate-left {
    opacity: 0;
    visibility: hidden; /* Tambahan agar tidak bisa diklik sebelum muncul */
    transition: opacity 0.6s ease-out, transform 0.6s ease-out;
}

.animate-up.show, .animate-left.show {
    opacity: 1;
    visibility: visible;
}

/* Variasi Delay agar muncul bergantian */
.delay-1 { animation-delay: 0.2s; }
.delay-2 { animation-delay: 0.4s; }
.delay-3 { animation-delay: 0.6s; }

/* Timeline Styles */
.timeline-container {
    padding: 60px 0;
    position: relative;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-start; /* Memastikan semua teks mulai dari titik yang sama di atas */
}

.timeline-line {
    position: absolute;
    top: 72px; 
    left: 0;
    right: 0;
    height: 1px;
    background-color: rgba(255, 255, 255, 0.1);
    z-index: 1;
}

.timeline-item {
    position: relative;
    z-index: 2;
    flex: 1; /* Memberikan ruang yang sama rata untuk tiap item */
    min-width: 180px; /* Mencegah item terlalu sempit di desktop */
    padding: 0 15px; /* Memberi jarak antar kolom teks */
    box-sizing: border-box;
}

.timeline-dot {
    width: 20px;
    height: 20px;
    background-color: var(--secondary-color); /* Sesuaikan dengan warna primer anda */
    border: 4px solid var(--text-color); /* Sesuaikan dengan background dark anda */
    border-radius: 50%;
    margin-bottom: 15px;
    box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.2);
}

.timeline-year {

    <script>
      // 1. Definisikan Options terlebih dahulu
    const observerOptions = {
        threshold: 0.2 // Animasi jalan jika 20% elemen terlihat
    };

    const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
            if (entry.isIntersecting) {
                entry.target.classList.add("show");
                
                // Cek jika ada elemen typing-text di dalamnya
                const typingElement = entry.target.querySelector("#typing-text");
                if (typingElement && typeof typeText === "function") {
                    typeText();
                }
            }
        });
    }, observerOptions);

    // 2. Jalankan observer setelah halaman dimuat
    document.addEventListener("DOMContentLoaded", () => {
        const animatedElements = document.querySelectorAll(".animate-up, .animate-left");
        animatedElements.forEach((el) => observer.observe(el));
    });
    </script>
