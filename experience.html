        .text-gradient{

        /* Trik Clipping Text */
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: transparent; /* Fallback jika browser tidak support webkit */
        
        font-weight: 800;
        display: inline-block;
    
        }

        [data-theme="dark"] body{

        @keyframes blink { 
            0%, 50%, 100% { 
                opacity: 1; 
            } 25%, 75% { 
                opacity: 0; 
            } 
        }

        /* animate */
        /* 1. Definisikan gerakan animasi */
        @keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeInLeft {
    from {
        opacity: 0;
        transform: translateX(-30px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

/* Pastikan elemen tersembunyi sepenuhnya sebelum ada class .show */
.animate-up, .animate-left {
    opacity: 0;
    visibility: hidden; /* Tambahan agar tidak bisa diklik sebelum muncul */
    transition: opacity 0.6s ease-out, transform 0.6s ease-out;
}

.animate-up.show, .animate-left.show {
    opacity: 1;
    visibility: visible;
}

/* Variasi Delay agar muncul bergantian */
.delay-1 { animation-delay: 0.2s; }
.delay-2 { animation-delay: 0.4s; }
.delay-3 { animation-delay: 0.6s; }


    </style>

    <script>
      // 1. Definisikan Options terlebih dahulu
    const observerOptions = {
        threshold: 0.2 // Animasi jalan jika 20% elemen terlihat
    };

    const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
            if (entry.isIntersecting) {
                entry.target.classList.add("show");
                
                // Cek jika ada elemen typing-text di dalamnya
                const typingElement = entry.target.querySelector("#typing-text");
                if (typingElement && typeof typeText === "function") {
                    typeText();
                }
            }
        });
    }, observerOptions);

    // 2. Jalankan observer setelah halaman dimuat
    document.addEventListener("DOMContentLoaded", () => {
        const animatedElements = document.querySelectorAll(".animate-up, .animate-left");
        animatedElements.forEach((el) => observer.observe(el));
    });
    </script>
