<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KhaisanDEV</title>
    <link rel="icon" type="image/png" href="./assets/img/logo-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="style.css">
    <style>

    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="container">
        <div class="row align-items-center mt-2 mt-lg-5 p-3">
            <div class="col-12 order-1 order-md-1 text-center">
                <h1>Portfolio</h1>
                <p>Menampilkan koleksi proyek terpilih dalam bidang pengembangan perangkat lunak dan desain sistem.</p>
            </div>
        </div>
    </div>
  
    <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
        const text = "Hi, I'm Khaisan Ramzi Muzhaffar";
        const typingElement = document.getElementById("typing-text");
        let index = 0;

        function typeText() {
            if (index < text.length) {
                typingElement.innerHTML += text.charAt(index);
                index++;
                setTimeout(typeText, 100);
            }
        }

        fetch("./navbar.html")
            .then((response) => response.text())
            .then((data) => {
                document.getElementById("navbar-placeholder").innerHTML = data;
                
                const currentLocation = window.location.pathname.split("/").pop();
                const navLinks = document.querySelectorAll(".nav-link");

                navLinks.forEach((link) => {
                    const href = link.getAttribute("href");
                    if (href === currentLocation || (currentLocation === "" && href === "index.html")) {
                        link.classList.add("active");
                    }
                });

                window.addEventListener("scroll", function () {
                    const navbar = document.querySelector(".navbar");
                    if (navbar) {
                        if (window.scrollY > 50) {
                            navbar.classList.add("navbar-scrolled shadow-sm");
                        } else {
                            navbar.classList.remove("navbar-scrolled shadow-sm");
                        }
                    }
                });
            });

        document.addEventListener("DOMContentLoaded", typeText);
    </script>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
